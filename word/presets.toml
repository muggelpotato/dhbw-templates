# Presets
# Diese Datei kopieren und befüllen
# Jeder Schlüssel aus quelle/ lässt sich durch ein preset überschreiben, etwa stil.PlaceholderText.farbe = '0070C0' für Tipps und Platzhalter
# Eine Formatvorlage kann zusätzlich durch Schlüssel ergänzt werden, die sie in quelle/ nicht hat, vorausgesetzt, eine andere Formatvorlage hat sie, etwa stil.Heading1.farbe = 'C00000' für Überschrift 1
# Die Schriftart der Vorlage muss bei Bedarf an fünf Stellen geändert werden: dokument.standard.schriftart, stil.Title.schriftart, stil.Heading1.schriftart bis stil.Heading3.schriftart (Kopf und Fuß behalten Tahoma)
# Siehe die Platzhalter in der Standardvorlage für die erwartete Formatierungen der Felder wie `Titel Vorname Nachname` für angabe.betreuerhochschule.vorbelegung oder `Vorname Nachname, Vorname Nachname` für angabe.autoren.vorbelegung

