# Steuerelemente
# Diese Datei führt die Angaben mit Speicher und Vorbelegung, dazu alle Steuerelemente.

# Speicher
[speicher.kern]
namensraum = 'http://purl.org/dc/elements/1.1/; http://schemas.openxmlformats.org/package/2006/metadata/core-properties'
wurzel = 'coreProperties'
praefix = 'ns0; ns1'
kennung = '{6C3C8BC8-F283-45AE-878A-BAB7291924A1}'

[speicher.xmlteil]
namensraum = 'urn:dhbw-templates:angaben:1'
wurzel = 'angaben'
praefix = 'ns0'
kennung = '{A47EA0CD-D4EA-40D7-A434-2E2993F16693}'

# Angaben
[angabe.titel]
steuerelement = 'Nur-Text'
xpath = '/ns1:coreProperties[1]/ns0:title[1]'
vorbelegung = ''

[angabe.art]
steuerelement = 'Kombinationsfeld'
xpath = '/ns1:coreProperties[1]/ns0:subject[1]'
vorbelegung = ''

[angabe.abschluss]
steuerelement = 'Kombinationsfeld'
xpath = '/ns0:angaben[1]/ns0:abschluss[1]'
vorbelegung = ''

[angabe.studiengang]
steuerelement = 'Kombinationsfeld'
xpath = '/ns0:angaben[1]/ns0:studiengang[1]'
vorbelegung = ''

[angabe.verfasser]
steuerelement = 'Nur-Text'
xpath = '/ns0:angaben[1]/ns0:verfasser[1]'
vorbelegung = ''

[angabe.abgabedatum]
steuerelement = 'Datum'
xpath = '/ns0:angaben[1]/ns0:abgabedatum[1]'
datumsformat = 'd. MMMM yyyy'
sprache = 'de-DE'
speicherform = 'Datum'
vorbelegung = ''

[angabe.ort]
steuerelement = 'Nur-Text'
xpath = '/ns0:angaben[1]/ns0:ort[1]'
vorbelegung = ''

[angabe.datum]
steuerelement = 'Datum'
xpath = '/ns0:angaben[1]/ns0:datum[1]'
datumsformat = 'd. MMMM yyyy'
sprache = 'de-DE'
speicherform = 'Datum'
vorbelegung = ''

[angabe.arbeitsform]
steuerelement = 'Dropdown'
xpath = '/ns0:angaben[1]/ns0:arbeitsform[1]'
vorbelegung = ''

[angabe.kurs]
steuerelement = 'Nur-Text'
xpath = '/ns0:angaben[1]/ns0:kurs[1]'
vorbelegung = ''

[angabe.firma]
steuerelement = 'Nur-Text'
xpath = '/ns0:angaben[1]/ns0:firma[1]'
vorbelegung = ''

[angabe.firmenort]
steuerelement = 'Nur-Text'
xpath = '/ns0:angaben[1]/ns0:firmenort[1]'
vorbelegung = ''

[angabe.betreuerfirma]
steuerelement = 'Nur-Text'
xpath = '/ns0:angaben[1]/ns0:betreuerfirma[1]'
vorbelegung = ''

[angabe.betreuerhochschule]
steuerelement = 'Nur-Text'
xpath = '/ns0:angaben[1]/ns0:betreuerhochschule[1]'
vorbelegung = ''

[angabe.anschrift]
steuerelement = 'Nur-Text'
xpath = '/ns0:angaben[1]/ns0:anschrift[1]'
vorbelegung = ''

[angabe.telefon]
steuerelement = 'Nur-Text'
xpath = '/ns0:angaben[1]/ns0:telefon[1]'
vorbelegung = ''

[angabe.email]
steuerelement = 'Nur-Text'
xpath = '/ns0:angaben[1]/ns0:email[1]'
vorbelegung = ''

[angabe.unternehmensdatum]
steuerelement = 'Datum'
xpath = '/ns0:angaben[1]/ns0:unternehmensdatum[1]'
datumsformat = 'd. MMMM yyyy'
sprache = 'de-DE'
speicherform = 'Datum'
vorbelegung = ''

# Steuerelemente der Angaben
[steuerelement.angaben]
sperre = 'Löschen'
stellen = 'titelblatt; kopf; fuss'

[steuerelement.angabenloeschbar]
stellen = 'titelblatt.angaben; text.arbeitsform.erklaerung1; text.erklaerung.absatz; text.erklaerung.ortdatum; text.erklaerung.unterschrift; text.freigabe.absatz; text.freigabe.ortdatum; text.sperrklausel.ortdatum; text.sperrklausel.unterschrift; text.sperrklausel.kontaktperson; text.sperrklausel.anschrift; text.sperrklausel.telefon; text.sperrklausel.email; text.kierklaerung.ortdatum; text.kierklaerung.unterschrift'

[steuerelement.arbeitsformanzeige]
platzhaltereintrag = 'ja'
stellen = 'text.arbeitsform'

# Steuerelemente des Sperrvermerks
[steuerelement.sperrvermerk]
sperre = 'keine'

[steuerelement.sperrhinweis]
art = 'Rich-Text'

# Ehrenwörtliche Erklärung und Umfang
[steuerelement.umfang]
